name: Deploy Staging (Laravel & Public)

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      SERVER_IP: '72.61.210.213'
      SERVER_USER: 'root'
      TARGET_DIR_LARAVEL: '/home/staging.gumpreneur.id/laravel'
      TARGET_DIR_PUBLIC: '/home/staging.gumpreneur.id/public_html'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'

      - name: Install Composer Dependencies
        run: |
          composer install --no-dev --optimize-autoloader --no-interaction --no-scripts

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install NPM & Build Inertia React
        run: |
          npm install
          npm run build

      - name: Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add Server to Known Hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Sync Core Laravel to Server
        run: |
          rsync -avz --delete \
            --exclude='.env' \
            --exclude='/storage/' \
            --exclude='/bootstrap/cache/' \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/public/' \
            ./ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.TARGET_DIR_LARAVEL }}/

      - name: Sync Public Assets to public_html
        run: |
          rsync -avz --delete \
            --exclude='index.php' \
            --exclude='.htaccess' \
            ./public/ ${{ env.SERVER_USER }}@${{ env.SERVER_IP }}:${{ env.TARGET_DIR_PUBLIC }}/

      - name: Run Artisan & Move Manifest
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.SERVER_IP }}
          username: ${{ env.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/public/build
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/bootstrap/cache
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/storage/app/public
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/storage/framework/cache
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/storage/framework/sessions
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/storage/framework/views
            mkdir -p ${{ env.TARGET_DIR_LARAVEL }}/storage/logs

            cp ${{ env.TARGET_DIR_PUBLIC }}/build/manifest.json \
              ${{ env.TARGET_DIR_LARAVEL }}/public/build/manifest.json

            cd ${{ env.TARGET_DIR_PUBLIC }}
            ln -sfn ../laravel/storage/app/public storage

            chown -R stagi4312:stagi4312 ${{ env.TARGET_DIR_LARAVEL }}
            chown -R stagi4312:stagi4312 ${{ env.TARGET_DIR_PUBLIC }}
            chmod -R 775 ${{ env.TARGET_DIR_LARAVEL }}/storage
            chmod -R 775 ${{ env.TARGET_DIR_LARAVEL }}/bootstrap/cache

            cd ${{ env.TARGET_DIR_LARAVEL }}
            php artisan optimize:clear
            php artisan migrate --force